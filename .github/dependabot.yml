version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: biweekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
