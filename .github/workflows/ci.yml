name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  MODULE_NAME: TerraformCloud

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build module
        shell: pwsh
        run: |
          Write-Host "Building module..."
          ./Build-Module.ps1 -SkipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: module-build
          path: Output/TerraformCloud/
          retention-days: 5

  test:
    name: Test (PS ${{ matrix.psversion }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        psversion: ["5.1", "7.x"]
        exclude:
          - os: ubuntu-latest
            psversion: "5.1"
          - os: macos-latest
            psversion: "5.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: module-build
          path: Output/TerraformCloud/

      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Invoke-AllTests.ps1 -TestType Unit -Coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.psversion }}
          path: TestResults/
          retention-days: 5

  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: module-build
          path: Output/TerraformCloud/

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./Output/TerraformCloud/TerraformCloud.psm1 -Recurse -ReportSummary

          if ($results | Where-Object Severity -eq 'Error') {
            Write-Error "PSScriptAnalyzer found errors!"
            exit 1
          }

          if ($results | Where-Object Severity -eq 'Warning') {
            Write-Warning "PSScriptAnalyzer found warnings"
            $results | Where-Object Severity -eq 'Warning' | Format-Table
          }

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: module-build
          path: Output/TerraformCloud/

      - name: Run integration tests
        shell: pwsh
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TFE_TOKEN)) {
            Write-Warning "TFE_TOKEN not set, skipping integration tests"
            exit 0
          }
          ./Tests/Invoke-AllTests.ps1 -TestType Integration

  publish:
    name: Publish to PowerShell Gallery
    runs-on: ubuntu-latest
    needs: [build, test, analyze]
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: module-build
          path: Output/TerraformCloud/

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:NUGET_API_KEY)) {
            Write-Error "NUGET_API_KEY not set!"
            exit 1
          }

          Publish-Module -Path ./Output/TerraformCloud -NuGetApiKey $env:NUGET_API_KEY -Verbose

      - name: Create release notes
        shell: pwsh
        run: |
          $version = (Import-PowerShellDataFile ./Output/TerraformCloud/TerraformCloud.psd1).ModuleVersion
          Write-Host "Published TerraformCloud module version $version to PowerShell Gallery"
