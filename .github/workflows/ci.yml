name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

env:
  MODULE_NAME: TerraformCloud

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build module
        shell: pwsh
        run: |
          Write-Host "Building module..."
          ./Build-Module.ps1 -SkipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: module-build
          path: Output/TerraformCloud/
          retention-days: 5

  test:
    name: Test (PS ${{ matrix.psversion }}-${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        psversion: ["5.1", "7.x"]
        exclude:
          - os: ubuntu-latest
            psversion: "5.1"
          - os: macos-latest
            psversion: "5.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: module-build
          path: Output/TerraformCloud/

      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Invoke-AllTests.ps1 -TestType Unit -Coverage

      - name: Upload test results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.psversion }}
          path: TestResults/
          retention-days: 5

  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: module-build
          path: Output/TerraformCloud/

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./Output/TerraformCloud/TerraformCloud.psm1 -Recurse -ReportSummary -Settings ./.psscriptanalyzer.psd1

          if ($results | Where-Object Severity -eq 'Error') {
            Write-Error "PSScriptAnalyzer found errors!"
            exit 1
          }

          if ($results | Where-Object Severity -eq 'Warning') {
            Write-Warning "PSScriptAnalyzer found warnings"
            $results | Where-Object Severity -eq 'Warning' | Format-Table
          }

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: module-build
          path: Output/TerraformCloud/

      - name: Run integration tests
        shell: pwsh
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TFE_TOKEN)) {
            Write-Warning "TFE_TOKEN not set, skipping integration tests"
            exit 0
          }
          ./Tests/Invoke-AllTests.ps1 -TestType Integration

