name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

env:
  MODULE_NAME: TerraformCloud

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job transfers artifacts through the
      #   Actions API and clones this repository; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build module
        shell: pwsh
        run: |
          Write-Host "Building module..."
          ./Build-Module.ps1 -SkipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-build
          path: Output/TerraformCloud/
          retention-days: 5

  test:
    name: Test (PS ${{ matrix.psversion }}-${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        psversion: ["5.1", "7.x"]
        exclude:
          - os: ubuntu-latest
            psversion: "5.1"
          - os: macos-latest
            psversion: "5.1"

    steps:
      # hardening-exception: egress-audit — this job transfers artifacts through the
      #   Actions API and clones this repository; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: module-build
          path: Output/TerraformCloud/

      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Invoke-AllTests.ps1 -TestType Unit -Coverage

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.psversion }}
          path: TestResults/
          retention-days: 5

  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      # hardening-exception: egress-audit — this job downloads the CodeQL bundle and
      #   its query packs, transfers artifacts through the Actions API, and clones
      #   this repository; harden-runner has never run in this repository, so no
      #   endpoint baseline exists and a block policy written without one fails closed
      #   on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: module-build
          path: Output/TerraformCloud/

      # Inlined instead of using microsoft/psscriptanalyzer-action — that
      # wrapper has had no commits since 2023-03 and an open community
      # request to mark it stale. The wrapper just installs PSScriptAnalyzer
      # + ConvertToSARIF and pipes them together, which we do here directly.
      - name: Run PSScriptAnalyzer and emit SARIF
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name ConvertToSARIF    -Scope CurrentUser -Force
          Import-Module ConvertToSARIF
          $results = Invoke-ScriptAnalyzer `
            -Path ./Output/TerraformCloud/TerraformCloud.psm1 `
            -Recurse `
            -Settings ./.psscriptanalyzer.psd1
          # Always emit SARIF (even when empty) so the upload step has a file
          $results | ConvertTo-SARIF -FilePath results.sarif
          $errors   = @($results | Where-Object Severity -eq 'Error')
          $warnings = @($results | Where-Object Severity -eq 'Warning')
          Write-Host "PSScriptAnalyzer: $($errors.Count) error(s), $($warnings.Count) warning(s)"
          if ($warnings) { $warnings | Format-Table }
          if ($errors)   {
            $errors | Format-Table
            Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)"
            exit 1
          }

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build, test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      # hardening-exception: egress-audit — this job transfers artifacts through the
      #   Actions API and clones this repository; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: module-build
          path: Output/TerraformCloud/

      - name: Run integration tests
        shell: pwsh
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TFE_TOKEN)) {
            Write-Warning "TFE_TOKEN not set, skipping integration tests"
            exit 0
          }
          ./Tests/Invoke-AllTests.ps1 -TestType Integration

