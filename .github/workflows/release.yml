name: Release

# Publishes the TerraformCloud module to PowerShell Gallery and creates a
# GitHub Release whenever a semver tag is pushed (e.g. v1.2.3).
#
# Artifacts produced:
#   - Module zip attached to the GitHub Release
#   - GitHub Artifact Attestation for build provenance
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Branch guard — releases must originate from main ─────────────────────
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Check tagged commit is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must be pushed on the main branch." \
                 "This tag points to a commit that is not in origin/main."
            exit 1
          fi
          echo "Tag is on main — proceeding with release."

  # ── CI gate — full test suite must pass before publishing ─────────────────
  ci:
    name: CI
    needs: guard
    secrets: inherit
    # Permission ceiling for the reusable workflow. ci.yml's analyze job
    # uploads SARIF to GitHub code scanning, which requires
    # security-events: write. Reusable workflows cannot exceed the
    # caller's per-job permissions, so we must grant it here.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  # ── Build module and attach to GitHub Release ──────────────────────────────
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: ci
    environment: gallery
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Build module
        shell: pwsh
        run: ./Build-Module.ps1 -SkipTests

      - name: Verify module version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $tagVersion = $tag.TrimStart('v')
          $psd1Version = (Import-PowerShellDataFile ./Output/TerraformCloud/TerraformCloud.psd1).ModuleVersion
          if ($tagVersion -ne $psd1Version) {
            Write-Error "Tag version ($tagVersion) does not match module version ($psd1Version). Run release-please to sync versions."
            exit 1
          }
          Write-Host "Version match confirmed: $psd1Version"

      - name: Zip module for release asset
        run: |
          cd Output
          zip -r "../TerraformCloud-${{ github.ref_name }}.zip" TerraformCloud/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "TerraformCloud-${{ github.ref_name }}.zip"

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          Install-Module -Name Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -SkipPublisherCheck
          Publish-PSResource -Path ./Output/TerraformCloud -ApiKey $env:NUGET_API_KEY -Repository PSGallery -Verbose

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          NOTES="## Supply-chain verification

          Build provenance is attested via GitHub Artifact Attestations.

          \`\`\`bash
          gh attestation verify TerraformCloud-${TAG}.zip --repo ${REPO}
          \`\`\`

          ## Install from PowerShell Gallery

          \`\`\`powershell
          Install-Module -Name TerraformCloud -RequiredVersion ${TAG#v}
          \`\`\`"

          if gh release view "${TAG}" --repo "${REPO}" > /dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${REPO}" --clobber \
              "TerraformCloud-${TAG}.zip"
            EXISTING="$(gh release view "${TAG}" --repo "${REPO}" --json body -q .body)"
            gh release edit "${TAG}" --repo "${REPO}" --draft=false \
              --notes "${EXISTING}

          ${NOTES}"
          else
            gh release create "${TAG}" --repo "${REPO}" \
              --title "${TAG}" \
              --generate-notes \
              --notes-file /dev/null \
              "TerraformCloud-${TAG}.zip"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
