name: Weekly Security Scan

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}

jobs:
  ci:
    name: CI
    secrets: inherit
    # Permission ceiling for the reusable workflow. ci.yml's analyze job
    # uploads SARIF to GitHub code scanning, which requires
    # security-events: write. Reusable workflows cannot exceed the
    # caller's per-job permissions, so we must grant it here.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  # ── Legitify: GitHub misconfiguration scan ────────────
  # Audits this repo's GitHub settings (workflow permissions, secret
  # scanning posture, fork policies, etc.). The action uploads SARIF
  # to the Security tab itself when upload_code_scanning is true
  # (default), so no separate upload step is needed.
  #
  # NOTE: GITHUB_TOKEN cannot grant the `administration: read` scope,
  # so policies that require it (branch protection details, repo
  # admin settings) will be skipped. For full coverage, switch
  # github_token to a PAT or GitHub App token with admin:read.
  legitify:
    name: Legitify (repo misconfig audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Run Legitify
        # Non-blocking: GITHUB_TOKEN cannot grant the scopes Legitify needs to
        # self-audit this public repo, so it exits 1 with "insufficient
        # permissions" on every scheduled run — and no tagged release carries a
        # graceful skip. Let SARIF upload when it can, but don't fail the whole
        # weekly run (and auto-file an issue) over this known token limitation.
        continue-on-error: true
        # Pinned to the post-v1.0.11 main commit (PR #333) that replaces the
        # internal actions/upload-artifact@v3 — GitHub now hard-fails v3, which
        # broke every run since the deprecation (issues #20, #21). No tagged
        # release carries the fix yet; re-pin to a tag once one ships.
        uses: Legit-Labs/legitify@038aa49473a6974a3ef79f6c76b949b689d23282 # main @ 2024-09-11 (post-v1.0.11)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          analyze_self_only: "true"
          scorecard: "no"
          upload_code_scanning: "true"

  # ── Stale Dependabot PRs ──────────────────────────────
  stale-dependabot:
    name: Flag stale Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label PRs open > 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state open \
            --json number,createdAt,title \
            --jq '.[] | select((.createdAt | fromdateiso8601) < (now - 1209600)) | .number' \
          | xargs -r -I{} gh pr edit {} \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "stale-security-patch" || true

  # ── Notify on failure ─────────────────────────────────
  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    needs: [ci, legitify, stale-dependabot]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Scheduled build failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Scheduled Build Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The weekly security scan failed. Please investigate and fix before the next release.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci'],
            });
