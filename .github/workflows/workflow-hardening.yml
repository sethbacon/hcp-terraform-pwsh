---
# Workflow-hardening gate, delegated to 4cloudguru/shared-workflows.
#
# Asserts four properties are ENFORCED rather than conventionally held: every
# `uses:` pinned to a full SHA and labelled with the version that SHA is, every
# job bounded by a timeout, harden-runner running first, and npm installs
# refusing dependency scripts.
#
# Pointed here it found 25. This repository had the loosest release-please
# permission model of the thirteen and ran harden-runner zero times anywhere.
#
# NO script-ref, deliberately. The workflow derives the checker's commit from
# `github.job_workflow_sha` -- the commit it was itself resolved at -- so the
# checker and the workflow cannot disagree and there is no second pin for
# Dependabot to half-update. It used to take that commit as an input, and every
# bump landed half-applied and red until a human moved the second line; this
# repository was the last instance. The checker is still taken from
# shared-workflows rather than from here, so this repo cannot weaken its own
# gate by editing a local copy -- there is no local copy.
name: Workflow Hardening

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-hardening-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-hardening:
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-hardening.yml@b5aacb7c52bf279be8fe262a8aa67aa8945bcfec # v1.22.0